name: Native package smoke

on:
  pull_request:
  push:
    branches: [main, rewrite/v1]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Build ${{ matrix.platform }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [win32-arm64, win32-x64]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun ci

      - name: Cross-compile Windows executable
        run: bun run build:native -- --target ${{ matrix.platform }}

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: jira-flow-${{ matrix.platform }}
          path: dist/native/${{ matrix.platform }}/jira-flow.exe
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: ${{ matrix.os }} / ${{ matrix.manager }}
    needs: windows-native
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, bun]
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node for package-manager launcher
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        run: npm install --global pnpm@11.22.0

      - name: Install locked dependencies
        run: bun ci

      - name: Download Windows executable
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: jira-flow-${{ matrix.platform }}
          path: dist/native/${{ matrix.platform }}

      - name: Build host-native package
        if: runner.os != 'Windows'
        run: |
          bun run build:native -- --target ${{ matrix.platform }}
          bun run package:native -- --local

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        run: bun run package:native -- --local

      - name: Prepare registry-shaped package for Bun on Windows
        if: runner.os == 'Windows' && matrix.manager == 'bun'
        run: bun run package:native

      - name: Set up Bun package manager under test
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Run global package smoke
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bun run smoke:package -- --manager "${{ matrix.manager }}" --package "dist/packages/jira-flow-${VERSION}.tgz"

      - name: Verify package install did not dirty source repository
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
