name: Native package smoke

on:
  pull_request:
  push:
    branches: [main, rewrite/v1]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: ${{ matrix.os }} / ${{ matrix.manager }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        manager: [npm, pnpm, bun]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node for package-manager launcher
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        run: npm install --global pnpm@11.22.0

      - name: Install locked dependencies
        run: bun ci

      - name: Build host-native package
        run: |
          bun run build:native
          bun run package:native -- --local

      - name: Run global package smoke
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bun run smoke:package -- --manager "${{ matrix.manager }}" --package "dist/packages/jira-flow-${VERSION}.tgz"

      - name: Verify package install did not dirty source repository
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
