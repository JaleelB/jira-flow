name: Publish JiraFlow release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already merged by Release Please
        required: true
        type: string
      channel:
        description: npm dist-tag; prereleases use next and stable uses latest
        required: true
        type: choice
        options: [next, latest]

permissions:
  contents: read

concurrency:
  group: publish-jira-flow
  cancel-in-progress: false

jobs:
  native-package-smoke:
    uses: ./.github/workflows/package-smoke.yml

  publish:
    needs: native-package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v6

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an OIDC-capable npm CLI
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)) process.exit(1)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked cross-platform build inputs
        run: bun install --frozen-lockfile --os=* --cpu=*

      - name: Require the protected main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases may only be dispatched from main."
          exit 1

      - name: Verify requested version and npm channel
        run: bun run verify:release -- --tag "v${{ inputs.version }}" --channel "${{ inputs.channel }}"

      - name: Run full release test gate
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Build native packages, archives, and checksums
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          bun run build:native -- --all
          bun run package:native -- --all
          bun run package:release -- --all
          bun run verify:release -- --tag "v${{ inputs.version }}" --channel "${{ inputs.channel }}" --artifacts

      - name: Attest standalone release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS

      - name: Create recoverable draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "JiraFlow $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.tar.gz dist/release/*.zip dist/release/SHA256SUMS --clobber

      - name: Publish native npm packages with OIDC
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          for package in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            if npm view "jira-flow-${package}@${VERSION}" version 2>/dev/null | grep -Fx "$VERSION"; then
              echo "jira-flow-${package}@${VERSION} is already published"
            else
              npm publish "dist/packages/jira-flow-${package}-${VERSION}.tgz" --tag "$CHANNEL" --access public
            fi
          done

      - name: Publish universal npm package last with OIDC
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if npm view "jira-flow@${VERSION}" version 2>/dev/null | grep -Fx "$VERSION"; then
            echo "jira-flow@${VERSION} is already published"
          else
            npm publish "dist/packages/jira-flow-${VERSION}.tgz" --tag "$CHANNEL" --access public
          fi

      - name: Publish GitHub release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=${{ inputs.channel == 'next' }}
